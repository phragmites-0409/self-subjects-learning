name: Verify source
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and OCR libraries
        run: python -m pip install -r dependencies/requirements/main.txt
      - name: Test backends
        shell: pwsh
        run: |
          foreach ($project in @('subjects-learning-1', 'subjects-learning-2')) {
            Push-Location $project
            python -m pytest -q -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) { throw "Backend tests failed: $project" }
            Pop-Location
          }
      - name: Test and build frontends
        shell: pwsh
        run: |
          foreach ($project in @('subjects-learning-1', 'subjects-learning-2')) {
            Push-Location "$project/frontend"
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed: $project" }
            if ($project -eq 'subjects-learning-2') {
              npm test -- --run
              if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed: $project" }
            }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend build failed: $project" }
            Pop-Location
          }
